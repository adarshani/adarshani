<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pizza Game</title>
    <style>
        body {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: linear-gradient(135deg, #ff9a9e 0%, #fad0c4 100%);
            margin: 0;
            font-family: Arial, sans-serif;
        }

        .game-container {
            text-align: center;
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
            width: 300px;
        }

        .pizza {
            position: relative;
            margin: 20px 0;
        }

        .pizza img {
            width: 100%;
        }

        .topping-buttons {
            margin: 20px 0;
        }

        button {
            padding: 10px 20px;
            margin: 5px;
            background-color: #ff6f61;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background-color: #ff5f50;
        }

        .submit-button {
            display: block;
            margin: 20px auto;
        }

        p {
            font-size: 1.2em;
            color: #444;
        }
    </style>
</head>

<body>
    <div class="game-container">
        <h1>Pizza Game</h1>
        <div class="pizza">
            <img src="pizza-base.png" alt="Pizza Base">
            <div id="toppings"></div>
        </div>
        <div class="topping-buttons">
            <button onclick="addTopping('pepperoni')">Add Pepperoni</button>
            <button onclick="addTopping('mushrooms')">Add Mushrooms</button>
            <button onclick="addTopping('green-peppers')">Add Green Peppers</button>
        </div>
        <button class="submit-button" onclick="submitPizza()">Submit Pizza</button>
        <p id="message"></p>
    </div>
    <script>
        function addTopping(topping) {
            const toppingsDiv = document.getElementById('toppings');
            const img = document.createElement('img');
            img.src = `${topping}.png`;
            img.alt = topping;
            img.style.position = 'absolute';
            img.style.width = '50px';
            img.style.top = `${Math.random() * 200}px`;
            img.style.left = `${Math.random() * 200}px`;
            toppingsDiv.appendChild(img);
        }

        function submitPizza() {
            const message = document.getElementById('message');
            message.innerHTML = "Pizza submitted!";
        }
    </script>
</body>

</html>
