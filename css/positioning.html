<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Positioning in HTML</title>
  <style>
    .relative-box {
      position: relative;
      width: 200px;
      height: 100px;
      background-color: lightblue;
      margin-bottom: 20px;
    }

    .relative-box .inner-box {
      position: absolute;
      top: 10px;
      right: 10px;
      width: 80px;
      height: 40px;
      background-color: coral;
    }

    .fixed-box {
      position: fixed;
      bottom: 20px;
      right: 20px;
      width: 100px;
      height: 50px;
      background-color: lightgreen;
    }

    .sticky-box {
      position: -webkit-sticky;
      /* For Safari */
      position: sticky;
      top: 0;
      background-color: yellow;
      padding: 50px;
      font-size: 20px;
    }
  </style>
</head>

<body>
  <div class="relative-box">
    <div class="inner-box">Absolute</div>
    Relative Position
  </div>

  <div class="sticky-box">Sticky Position</div>

  <div style="height: 800px;">
    Scroll down to see the fixed box at the bottom-right corner.
  </div>

  <div class="fixed-box">Fixed</div>
</body>

</html>
