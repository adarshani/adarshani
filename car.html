<!DOCTYPE html>

<html>

<head>

    <title>

        Bootstrap Utilites

    </title>

    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css">

</head>

<body>

    <div class="container">

        <h2>carousel Example</h2>

        <div id="myCarousel" class="carousel slide" date-ride="carousel">

            <ol class="carousel-indicators">

                <li data-target="#myCarousel" data-slide-to="0" class="active"></li>

                <li data-target="#myCarousel" data-slide-to="1"></li>

                <li data-target="#myCarousel" data-slide-to="2"></li>

            </ol>

            <div clas="carousel-inner">

                <div class="item active">

                    <img src="venus 2.jpg" alt="Image 1">

                </div>

                <div class="item">

                    <img src="uranus-planet.jpg" alt="Image 1">

                </div>

                <div class="item">

                    <img src="ana1.png" alt="Image 2">

                </div>

            </div>

            <a class="left carousel-control" href="" data-slite="next">

                <span class="glyphicon glyphicon-chevren-right"></span>

                <span class="sr-only">Next</span>

            </a>

            <a class="left carousel-control" href="" data-slite="prev">

                <span class="glyphicon glyphicon-chevren-left"></span>

                <span class="sr-only">Prev</span>

            </a>

        </div>

    </div>

</body>

</html>
