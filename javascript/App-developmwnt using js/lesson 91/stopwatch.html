<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <div class="wrapper">
        <h1>Stopwatch</h1>
        <p><span id="seconds">00</span>:<span id="milliseconds">00</span><br><br></p>
        <button id="btn-start">Start</button><br><br>
        <button id="btn-stop">Stop</button><br><br>
        <button id="btn-reset">Reset</button><br><br>
       </div>
       <script>
        window.onload = function (){

            var seconds = "00";
            var milliseconds = "00";
            var appendseconds = document.getElementById("seconds");
             var appendmilliseconds = document.getElementById("milliseconds");
              var buttonStart = document.getElementById("btn-start");
              var buttonStop = document.getElementById("btn-stop");
              var buttonReset = document.getElementById("btn-reset");
              var Interval;

              buttonStart.onclick = function(){
                clearInterval(Interval)
                Interval = setInterval(startTimer,10)
              }

              buttonStop.onclick = function () {
                clearInterval(Interval) }

                  buttonReset.onclick = function () {
                clearInterval(Interval);
                milliseconds = "00";
                seconds = "00";
                appendmilliseconds.innerHTML=milliseconds;
                appendseconds.innerHTML=seconds;
            }
            	function startTimer() {
                milliseconds++;

                if (milliseconds <= 9) {
                    appendmilliseconds.innerHTML = "0" + milliseconds;
                }
                if (milliseconds > 9) {
                    appendmilliseconds.innerHTML = milliseconds;
                }

                if (milliseconds > 99) {
                    seconds++;
                    appendseconds.innerHTML = "0" + seconds;
                    milliseconds = 0;
                    appendmilliseconds.innerHTML = "0" + 0;
                }
                if (seconds > 9) {
                    appendseconds.innerHTML = seconds;
                }
            }
        }

    </script>
</body>
</html>
