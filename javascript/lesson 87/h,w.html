<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shopping To-Do List</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #e0f7fa;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h2 {
            color: #00796b;
        }

        form {
            margin-bottom: 20px;
        }

        input[type="text"] {
            padding: 10px;
            width: 200px;
            margin-right: 10px;
            border: 1px solid #00796b;
            border-radius: 4px;
            background-color: #ffffff;
        }

        button {
            padding: 10px 15px;
            background-color: #00796b;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }

        button:hover {
            background-color: #004d40;
        }

        ul {
            list-style-type: none;
            padding: 0;
            width: 300px;
        }

        li {
            background-color: #ffffff;
            padding: 10px;
            margin: 5px 0;
            border: 1px solid #00796b;
            border-radius: 4px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        li button {
            background-color: #e57373;
            padding: 5px 10px;
            border: none;
            border-radius: 4px;
            color: white;
            cursor: pointer;
        }

        li button:hover {
            background-color: #c62828;
        }
    </style>
</head>

<body>
    <h2>Shopping To-Do List</h2>
    <form id="myForm">
        <input type="text" id="myInput" placeholder="Add an item...">
        <button type="submit">Add</button>
    </form>
    <h2>Items to Buy</h2>
    <ul id="myItems"></ul>
    <script>
        var myForm = document.getElementById("myForm");
        var myInput = document.getElementById("myInput");
        var myItems = document.getElementById("myItems");

        myForm.addEventListener("submit", function (event) {
            event.preventDefault();
            if (myInput.value.trim() !== "") {
                createItem(myInput.value);
            }
        });

        function createItem(inputItem) {
            var item = `<li>${inputItem} 
                        <button onclick="deleteElement(this)">Delete</button></li>`;
            myItems.insertAdjacentHTML("beforeend", item);
            myInput.value = "";
            myInput.focus();
        }

        function deleteElement(toDeleteElement) {
            toDeleteElement.parentElement.remove();
        }
    </script>
</body>

</html>
