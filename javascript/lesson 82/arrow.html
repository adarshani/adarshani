<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <p>Arrow function in js</p>
    <p id="result"></p>
    <p id="result2"></p>
    <script>
        add=(a,b)=>a-b
        document.getElementById("result").innerHTML=add(4,6);
        function sub(x,y){
            return x-y
        }
        
        document.getElementById("result2").innerHTML=sub(3,2)
    </script>
</body>
</html>
