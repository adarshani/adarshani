<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Random Number Generator</title>
    <style>
        body {
            text-align: center;
            font-family: Helvetica, sans-serif;
        }

        #num {
            font-size: 320px;
        }

        #num:hover {
            cursor: pointer;
        }
    </style>
</head>

<body>
    <div>Start by Clicking below</div>
    <div id="num" onclick="stopstart()"></div>
    <script>
        var num;
        var stop = true;
        var t;

        function change() {
            var random = Math.random() * 100;
            random = Math.floor(random);
            num.innerHTML = random;
        }

        function stopstart() {
            if (stop) {
                stop = false;
                t = setInterval(change, 100);
            } else {
                clearInterval(t);
                stop = true;
            }
        }

        window.onload = function () {
            num = document.getElementById("num");
            stopstart();
        }
    </script>
</body>

</html>
