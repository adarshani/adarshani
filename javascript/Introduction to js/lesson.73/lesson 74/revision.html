<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <h2 id="myh"></h2>
    <p id="myp"></p>
    <p id="result"></p>
    <p id="result1"></p>
    <script>
        //Heading
        document.getElementById("myh").innerHTML = "MY First Java Script Project";
        //paragraph
        document.getElementById("myp").innerHTML = "My First Project"
        //variable
        var num1 = 6;
        var num2 = 5;
        var sum = num1 + num2
        document.getElementById("result").innerHTML = "The total sum is: " + sum
        //statements
        var x, y, z     //statement1
        var x = 5      //statement2
        var y = 6     //statement3
        var z = x * y  //statement4
        document.getElementById("result1").innerHTML = "The product of number is: " + z + "."

    </script>
</body>

</html>
