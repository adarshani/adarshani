<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Calculator</title>
    <style>
        body {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: linear-gradient(135deg, #f6d365 0%, #fda085 100%);
            margin: 0;
            font-family: Arial, sans-serif;
        }

        .container {
            background: rgba(255, 255, 255, 0.8);
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
            text-align: center;
        }

        h2 {
            color: #333;
            margin-bottom: 20px;
        }

        label {
            font-size: 1.2em;
            color: #444;
        }

        input[type="number"] {
            margin: 10px;
            padding: 10px;
            font-size: 1em;
            width: calc(100% - 22px);
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        button {
            padding: 10px 20px;
            font-size: 1em;
            background-color: #4caf50;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background-color: #45a049;
        }

        p {
            font-size: 1.2em;
            color: #444;
        }
    </style>
</head>

<body>
    <div class="container">
        <h2>Simple Calculator</h2>
        <label for="num1">Enter first number:</label>
        <input type="number" id="num1">
        <br>
        <label for="num2">Enter second number:</label>
        <input type="number" id="num2">
        <br><br>
        <button onclick="calculate()">Calculate</button>
        <br><br>
        <p id="demo"></p>
        <p id="demo1"></p>
        <p id="demo2"></p>
        <p id="demo3"></p>
        <p id="demo4"></p>
    </div>

    <script>
        function calculate() {
            var a = parseFloat(document.getElementById("num1").value);
            var b = parseFloat(document.getElementById("num2").value);
            var w = a + b;
            var x = b - a;
            var y = b / a;
            var z = b * a;
            document.getElementById("demo").innerHTML = "The sum of the numbers: " + w;
            document.getElementById("demo1").innerHTML = "The difference of the numbers: " + x;
            document.getElementById("demo2").innerHTML = "The quotient of the numbers: " + y;
            document.getElementById("demo3").innerHTML = "The product of the numbers: " + z;
            // assignment operator
            x += 4;
            document.getElementById("demo4").innerHTML = "The new value after assignment operation: " + x;
        }
    </script>
</body>

</html>
