<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Codingal</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: linear-gradient(135deg, #83a4d4, #b6fbff);
            font-family: 'Arial', sans-serif;
            margin: 0;
        }

        .container {
            text-align: center;
            background: rgba(255, 255, 255, 0.8);
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 8px 15px rgba(0, 0, 0, 0.2);
        }

        h1 {
            color: #4caf50;
            font-size: 3em;
            margin: 0;
        }

        h3 {
            color: #555;
            font-weight: normal;
            margin-bottom: 20px;
        }

        .result {
            font-size: 1.5em;
            font-weight: bold;
            color: #333;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>Codingal</h1>
        <h3>Function Declaration</h3>
        <div class="result">
            <script>
                var result = function (a, b) { return a * b; }
                document.write("The result of 5 * 8 is: " + result(5, 8));
            </script>
        </div>
    </div>
</body>

</html>
