<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h2>Methos in Array</h2>
    <p id="myjoin">
        <p id="Myfirstpop"></p>
        <p id="Mysecoundpop"></p>
        <script>
            var fruits=["Apple","banana","strawberry"]
            document.getElementById("myjoin").innerHTML=fruits.join("*")
            document.getElementById(Myfirstpop).innerHTML=fruits;fruits.pop();
            document.getElementById(Mysecoundpop).innerHTML=fruits

        </script>

    </p>
</body>
</html>
