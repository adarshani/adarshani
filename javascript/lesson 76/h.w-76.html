<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JavaScript Functions</title>
    <style>
        body {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #f6d365 0%, #fda085 100%);
            margin: 0;
        }

        .container {
            background: rgba(255, 255, 255, 0.8);
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
            text-align: center;
        }

        h2 {
            color: #333;
        }

        p {
            font-size: 1.2em;
            color: #444;
        }
    </style>
</head>

<body>
    <div class="container">
        <h2>Finding Maximum Value</h2>
        <p id="max-demo"></p>
        <h2>JavaScript Built-In Math Functions</h2>
        <p id="math-demo"></p>
    </div>
    <script>
        // Function to find the maximum value
        function findMax() {
            var i;
            var max = 0;
            for (i = 0; i < arguments.length; i++) {
                if (arguments[i] > max) { max = arguments[i]; }
            }
            return max;
        }
        document.getElementById("max-demo").innerHTML = "Max value: " + findMax(3, 1, 2);

        // Using JavaScript's built-in Math functions
        var value1 = Math.acos(-1);
        var value2 = Math.asin(1);
        var value3 = Math.atan(0.5);
        document.getElementById("math-demo").innerHTML = "Math.acos(-1): " + value1 + "<br>" +
            "Math.asin(1): " + value2 + "<br>" +
            "Math.atan(0.5): " + value3;
    </script>
</body>

</html>
