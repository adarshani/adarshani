<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Food Gallery Carousel</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background-color: #f7f7f7;
        }

        .carousel-container {
            display: flex;
            justify-content: center;
            align-items: center;
            height: calc(100vh - 100px); /* Adjust height to account for header */
        }

        .carousel {
            position: relative;
            max-width: 600px;
            overflow: hidden;
            /* Hide overflowing images */
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
        }

        .carousel-inner {
            display: flex;
            transition: transform 0.5s ease-in-out;
            /* Smooth sliding effect */
        }

        .carousel-item {
            min-width: 100%;
            /* Each item takes up full width */
            transition: opacity 0.5s ease;
            /* Optional for fade effects */
        }

        .carousel-item img {
            width: 100%;
            border-radius: 10px;
        }

        .carousel-control {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background-color: rgba(0, 0, 0, 0.5);
            border: none;
            color: white;
            font-size: 24px;
            cursor: pointer;
            padding: 10px;
            border-radius: 50%;
        }

        .carousel-control.prev {
            left: 10px;
        }

        .carousel-control.next {
            right: 10px;
        }

        header {
            background: linear-gradient(90deg, rgba(255, 94, 58, 1) 0%, rgba(255, 149, 58, 1) 100%);
            color: white;
            padding: 15px 0;
            text-align: center;
        }

        nav {
            display: flex;
            justify-content: center;
            background-color: #343a40;
            padding: 10px 0;
        }

        nav a {
            color: white;
            margin: 0 20px;
            text-decoration: none;
            padding: 10px 20px;
            border-radius: 5px;
            transition: background-color 0.3s ease;
        }

        nav a:hover {
            background-color: rgba(255, 149, 58, 0.8);
        }
    </style>
</head>

<body>
    <header>
        <h1>Delicious Eats</h1>
        <nav>
            <a href="home.html">Home</a>
            <a href="about.html">About</a>
            <a href="food-gallery-section.html">Food Gallery</a>
            <a href="menu-section.html">Menu</a>
            <a href="contact-section.html">Contact</a>
        </nav>
    </header>
    <div class="carousel">
        <div class="carousel-inner">
            <div class="carousel-item">
                <img src="pasta.jpeg" alt="Delicious Food 1">
            </div>
            <div class="carousel-item">
                <img src="gb.jpeg" alt="Delicious Food 2">
            </div>
            <div class="carousel-item">
                <img src="pt.jpeg" alt="Delicious Food 3">
            </div>
            <div class="carousel-item">
                <img src="pizza.jpeg" alt="Delicious Food 4">
            </div>
            <div class="carousel-item">
                <img src="dosa.jpeg" alt="Delicious Food 5">
            </div>
        </div>
        <button class="carousel-control prev" onclick="moveSlide(-1)">&#10094;</button>
        <button class="carousel-control next" onclick="moveSlide(1)">&#10095;</button>
    </div>
    <script>
        // Track the current slide index
        let currentIndex = 0;
        function moveSlide(direction) {
            // Get carousel container and all items
            const carouselInner = document.querySelector('.carousel-inner');
            const items = document.querySelectorAll('.carousel-item');
            const totalItems = items.length;
            // Update the currentIndex based on direction
            currentIndex = (currentIndex + direction + totalItems) % totalItems;
            // Slide the carousel by adjusting the transform property
            const offset = -currentIndex * 100; // Calculate offset percentage
            carouselInner.style.transform = `translateX(${offset}%)`;
        }
    </script>
</body>

</html>
