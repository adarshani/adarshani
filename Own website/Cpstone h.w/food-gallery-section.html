<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Food Gallery Carousel</title>
    <style>
        body {
  font-family: Arial, sans-serif;
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
  margin: 0;
  background-color: #f7f7f7;
}

.carousel {
  position: relative;
  max-width: 600px;
  overflow: hidden;
  border-radius: 10px;
  box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
}

.carousel-inner {
  display: flex;
  transition: transform 0.5s ease;
}

.carousel-item {
  min-width: 100%;
  transition: transform 0.5s ease;
}

.carousel-item img {
  width: 100%;
  border-radius: 10px;
}

.carousel-item.active {
  display: block;
}

.carousel-item:not(.active) {
  display: none;
}

.carousel-control {
  position: absolute;
  top: 50%;
  transform: translateY(-50%);
  background-color: rgba(0, 0, 0, 0.5);
  border: none;
  color: white;
  font-size: 24px;
  cursor: pointer;
  padding: 10px;
  border-radius: 50%;
  outline: none;
}

.carousel-control.prev {
  left: 10px;
}

.carousel-control.next {
  right: 10px;
}

    </style>
</head>

<body>
    <div class="carousel">
        <div class="carousel-inner">
            <div class="carousel-item active">
                <img src="pasta.jpeg" alt="Delicious Food 1">
            </div>
            <div class="carousel-item">
                <img src="gb.jpeg" alt="Delicious Food 2">
            </div>
            <div class="carousel-item">
                <img src="pt.jpeg" alt="Delicious Food 3">
            </div>
            <div class="carousel-item">
                <img src="pizza.jpeg" alt="Delicious Food 3">
            </div>
            <div class="carousel-item">
                <img src="dosa.jpeg" alt="Delicious Food 3">
            </div>
        </div>
        <button class="carousel-control prev" onclick="moveSlide(-1)">&#10094;</button>
        <button class="carousel-control next" onclick="moveSlide(1)">&#10095;</button>
    </div>
    <script>
        let currentIndex = 0;

            function moveSlide(direction) {
                const items = document.querySelectorAll('.carousel-item');
                const totalItems = items.length;

                items[currentIndex].classList.remove('active');
                currentIndex = (currentIndex + direction + totalItems) % totalItems;
                items[currentIndex].classList.add('active');
            }

    </script>
</body>

</html>
