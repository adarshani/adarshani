<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Food Gallery Carousel</title>
   <style>
    /* Body Styling */

body {

font-family: Arial, sans-serif;

margin: 0;

background-color: #f7f7f7;

}

/* Header Styling */

header {

background: linear-gradient(90deg, rgba(255, 94, 58, 1) 0%, rgba(255, 149, 58, 1) 100%);

color: white;

text-align: center;

padding: 15px;

margin-bottom: 20px;

}

/* Navigation Styling */

nav {

display: flex;

justify-content: center;

align-items: center; /* Centers vertically */

background-color: #343a40;

padding: 10px;

}

nav a {

color: white;

margin: 0 15px; /* Adjust spacing between links */

text-decoration: none;

padding: 10px 15px;

border-radius: 5px;

transition: background-color 0.3s ease;

}

nav a:hover {

background-color: rgba(255, 149, 58, 0.8);

}

/* Carousel Styling */

.carousel {

position: relative;

width: 100%; /* Take full width of container */

max-width: 600px;

margin: 20px auto; /* Center the carousel horizontally */

border-radius: 10px;

box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);

}

.carousel-inner {

display: flex;

transition: transform 0.5s ease;

}

.carousel-item {

min-width: 100%;

}

.carousel-item img {

width: 100%;

border-radius: 10px;

}

.carousel-control {

position: absolute;

top: 50%;

transform: translateY(-50%);

background-color: rgba(0, 0, 0, 0.5);

border: none;

color: white;

font-size: 24px;

cursor: pointer;

padding: 10px;

border-radius: 50%;

}

.carousel-control.prev {

left: 10px;

}

.carousel-control.next {

right: 10px;

}

/* Container for Page */

.container {

max-width: 1200px;

margin: auto;

padding: 20px;

text-align: center;

}
        
       
 </style>
 </head>
<body>
<header>
  <h1>Delicious Eats</h1>
  <nav>
    <a href="home.html">Home</a>
    <a href="about.html">About</a>
    <a href="food-gallery-section.html">Food Gallery</a>
    <a href="menu-section.html">Menu</a>
    <a href="contact-section.html">Contact</a>
  </nav></header>
</div>
    <div class="carousel">
        <div class="carousel-inner">
            <div class="carousel-item active">
                <img src="pasta.jpeg" alt="Delicious Food 1">
            </div>
            <div class="carousel-item">
                <img src="gb.jpeg" alt="Delicious Food 2">
            </div>
            <div class="carousel-item">
                <img src="pt.jpeg" alt="Delicious Food 3">
            </div>
            <div class="carousel-item">
                <img src="pizza.jpeg" alt="Delicious Food 3">
            </div>
            <div class="carousel-item">
                <img src="dosa.jpeg" alt="Delicious Food 3">
            </div>
        </div>
        <button class="carousel-control prev" onclick="moveSlide(-1)">&#10094;</button>
        <button class="carousel-control next" onclick="moveSlide(1)">&#10095;</button>
    </div>
    <script>
        let currentIndex = 0;

            function moveSlide(direction) {
                const items = document.querySelectorAll('.carousel-item');
                const totalItems = items.length;

                items[currentIndex].classList.remove('active');
                currentIndex = (currentIndex + direction + totalItems) % totalItems;
                items[currentIndex].classList.add('active');
            }

    </script>
</body>

</html>
